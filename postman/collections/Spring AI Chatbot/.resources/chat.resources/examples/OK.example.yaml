$kind: http-example
request:
  url: "{{baseUrl}}/api/v1/chat"
  method: POST
  headers:
    Accept: application/json
  body:
    type: json
    content: |-
      {
        "conversationId": "chat-001",
        "message": "Hello! Please introduce yourself."
      }
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "response": "Hello! I'm an AI assistant. How can I help?"
      }
order: 1000
