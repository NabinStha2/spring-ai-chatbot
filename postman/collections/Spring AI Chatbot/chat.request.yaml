$kind: http-request
name: Chat
order: 1000
method: POST
url: "{{base_url}}/api/v1/chat"
headers:
  Content-Type: application/json
  Accept: application/json
body:
  type: json
  content: |-
    {
      "message": "What is my name?"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('returns HTTP 200', () => {
        pm.response.to.have.status(200);
      });
      pm.test('returns a non-empty response field', () => {
        const body = pm.response.json();
        pm.expect(body.response).to.be.a('string').and.not.be.empty;
      });
    language: text/javascript
