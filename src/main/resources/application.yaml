spring:
  application:
    name: spring-ai-chatbot

  ai:
    ollama:
      base-url: http://localhost:11434
      chat:
        model: llama3.2:3b
      embedding:
        model: nomic-embed-text:latest

postman:
  sync:
    enabled: true
    openapi-url: http://localhost:8080/v3/api-docs
    spec-file: postman/openapi.json
    collection-name: Spring AI Chatbot
    collection-path: postman/collections/Spring AI Chatbot
    visualizer-request: chat/chat.request.yaml
    visualizer-script: postman/scripts/chat-visualizer.js
